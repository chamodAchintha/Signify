name: E29-gcn-finetune-sinhala-encoder-92s-10-10
# Fine tuning: encoder checkpoint from classification model trained with sinhala isolated data
# Train on 92 original + 322 synthetic sentences
# Train first 6 decoder layers
data:
  train_data_path: ./data/sinhala-sentence-5fps-102kpt-(92 + 322s)-train.pkl.gz
  dev_data_path: ./data/sinhala-sentence-5fps-102kpt-(8+2s)-dev.pkl.gz
  test_data_path: ./data/sinhala-sentence-5fps-102kpt-(8+2s)-test.pkl.gz
  feature_size: 102 # 102x2
  batch_size: 32
  max_sent_length: 30 # tokens wise
  tgt_language: si_LK
training:
  random_seed: 44
  model_dir: "./SavedModels/E29-gcn-finetune-sinhala-encoder-92s-10-10"
  optimizer: adamw
  learning_rate: 0.001
  batch_size: 32
  epochs: 200
  shuffle: true
  use_cuda: true
  betas:
    - 0.9
    - 0.998
  learning_rate_min: 0.00001
  patience: 6
  decrease_factor: 0.8
  # es_patience: 10
  # es_min_delta: 0
model:
  inference_sample_size: 4
  use_checkpoint: false
  checkpoint: ""
  encoder:
    use_checkpoint: true
    checkpoint: ./SavedModels/classification-gcn/best_model.pth
    skip_encoder: false
    type: transformer
    bayesian_attention: true
    bayesian_feedforward: true
    ibp: false
    activation: lwta
    lwta_competitors: 4
    num_layers: 3
    num_heads: 8
    embeddings:
      freeze: false
      embedding_dim: 512
      # for GCN embeddings
      gcn: true
      in_channels: 2
      num_layers: 3
      hidden_dim: 3
      scale: false
      bayesian: true
      ibp: false
      dropout: 0.2
      norm_type: batch
      activation_type: lwta
      lwta_competitors: 4
    hidden_size: 512
    ff_size: 2048
    dropout: 0.2
    freeze: false
    num_layers_to_freeze: 2
    freeze_lower_layers: true
    freeze_layers: [] # subset of [layer_norm, src_src_att, feed_forward]
  decoder:
    freeze: true # this will freeze all layers
    # if freeze is true, you can choose to train some layers using following layers. if freeze is false all layers will be trained regardless following layers.
    num_layers_to_train: 6 # <=12
    train_lower_layers: true
    # train_layers should be a subset of
    # [self_attn, self_attn_layer_norm, encoder_attn, encoder_attn_layer_norm, fc1, fc2, final_layer_norm]
    train_layers:
      [encoder_attn, encoder_attn_layer_norm, fc1, fc2, final_layer_norm]
  freeze_projection_layer: false
